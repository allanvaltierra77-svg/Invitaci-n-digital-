<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Vale de invitación de Allan y Paty</title>
<desc id="desc">Vale moderno en beige y verde olivo, con anillos debajo del texto de acceso especial a nuestra boda.</desc>
<defs>
 <linearGradient id="beige" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf7"/><stop offset=".55" stop-color="#f4eedf"/><stop offset="1" stop-color="#e9e1d1"/></linearGradient>
 <linearGradient id="olive" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#303b20"/><stop offset=".5" stop-color="#59663a"/><stop offset="1" stop-color="#354124"/></linearGradient>
 <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#74804e"/><stop offset=".55" stop-color="#3d4927"/><stop offset="1" stop-color="#29351d"/></linearGradient>
 <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".19"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- ticket body -->
<rect x="34" y="30" width="1132" height="540" rx="66" fill="url(#beige)" stroke="#4a5730" stroke-width="15" filter="url(#shadow)"/>
<rect x="52" y="48" width="1096" height="504" rx="51" fill="none" stroke="#e8e1d3" stroke-width="5"/>
<rect x="65" y="61" width="1070" height="478" rx="43" fill="none" stroke="#657248" stroke-width="2"/>
<!-- layered folded olive corners -->
<path d="M75 165Q75 75 190 64H365L75 270Z" fill="url(#fold)"/>
<path d="M75 270L365 64H420Q270 95 165 205Q115 248 75 310Z" fill="#7b8658" opacity=".48"/>
<path d="M75 270Q170 150 365 64" fill="none" stroke="#e8e2d5" stroke-width="3" opacity=".9"/>
<path d="M1125 420Q1030 500 840 538H1110Q1125 520 1125 475Z" fill="url(#fold)"/>
<path d="M1125 420Q1020 515 840 538" fill="none" stroke="#e8e2d5" stroke-width="3" opacity=".9"/>
<!-- subtle leaf motif -->
<g fill="none" stroke="#3e4b29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
 <path d="M350 120q-30-28-56 0q27 23 56 0q28-28 57 0q-28 23-57 0"/>
 <path d="M350 120q-2-28 0-45 M350 101q-16-17-31-12 M350 101q16-17 31-12"/>
</g>
<!-- left text block -->
<g text-anchor="middle" fill="#354124">
 <text x="360" y="205" font-family="Georgia,serif" font-size="58">Vale de</text>
 <text x="360" y="284" font-family="Georgia,serif" font-style="italic" font-size="72">Invitación</text>
 <path d="M225 310Q360 333 495 310" fill="none" stroke="#485532" stroke-width="3"/>
 <text x="360" y="374" font-family="Georgia,serif" font-size="24" font-weight="600" letter-spacing="5">ACCESO ESPECIAL A</text>
 <text x="360" y="414" font-family="Georgia,serif" font-size="24" font-weight="600" letter-spacing="5">NUESTRA BODA</text>
</g>
<!-- wedding rings centered directly below access wording -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
 <!-- Fine olive lines framing the rings -->
 <path d="M220 463H282 M446 463H508" stroke="#465432" stroke-width="4"/>
 <!-- Interlocking rings with layered bevels and soft highlights -->
 <ellipse cx="340" cy="463" rx="48" ry="29" transform="rotate(-28 340 463)" stroke="#26331d" stroke-width="12"/>
 <ellipse cx="388" cy="463" rx="48" ry="29" transform="rotate(28 388 463)" stroke="#26331d" stroke-width="12"/>
 <ellipse cx="340" cy="459" rx="46" ry="26" transform="rotate(-28 340 459)" stroke="#78865a" stroke-width="3"/>
 <ellipse cx="388" cy="459" rx="46" ry="26" transform="rotate(28 388 459)" stroke="#78865a" stroke-width="3"/>
 <path d="M303 446q18-25 48-22 M401 445q22 5 29 24" stroke="#d9dfc6" stroke-width="3" opacity=".9"/>
 <path d="M307 482q27 14 51-4 M374 478q24 17 48 1" stroke="#182415" stroke-width="3" opacity=".8"/>
</g>
<!-- center divider -->
<path d="M625 115V485" stroke="#657248" stroke-width="3"/>
<circle cx="625" cy="115" r="5" fill="#657248"/><circle cx="625" cy="485" r="5" fill="#657248"/>
<!-- right plaque -->
<path d="M705 150H1050Q1082 150 1095 179L1115 210 1095 241Q1082 270 1050 270H705Q673 270 660 241L640 210 660 179Q673 150 705 150Z" fill="url(#olive)" stroke="#344123" stroke-width="4"/>
<path d="M706 161H1049Q1073 161 1085 184L1099 210 1085 236Q1073 259 1049 259H706Q682 259 670 236L656 210 670 184Q682 161 706 161Z" fill="none" stroke="#dce1cf" stroke-width="2"/>
<!-- calendar-heart icon -->
<g fill="none" stroke="#f7f5ed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
 <rect x="700" y="183" width="70" height="65" rx="10"/>
 <path d="M716 174v19 M754 174v19 M700 204h70"/>
 <path d="M735 221c-14-18-30 0 0 22 30-22 14-40 0-22z"/>
</g>
<path d="M792 180V240" stroke="#e8e6db" stroke-width="2" opacity=".8"/>
<g text-anchor="middle" fill="#f8f6ee" font-family="Georgia,serif" letter-spacing="4">
 <text x="930" y="207" font-size="37">INVITACIÓN</text>
 <text x="930" y="249" font-size="37">DIGITAL</text>
</g>
<g text-anchor="middle" fill="#354124">
 <text x="875" y="350" font-family="Georgia,serif" font-style="italic" font-size="34">Confirma tu asistencia</text>
 <text x="875" y="394" font-family="Georgia,serif" font-style="italic" font-size="34">en nuestra invitación</text>
</g>
<path d="M730 445H825 M925 445H1020" stroke="#53613a" stroke-width="3"/>
<path d="M875 429c-16-22-37-1 0 30 37-31 16-52 0-30z" fill="none" stroke="#3d4a28" stroke-width="4"/>
</svg>